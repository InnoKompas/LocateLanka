version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: lankalocate-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-lankalocate}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - lankalocate-network

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: lankalocate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lankalocate-network

  # LankaLocate API Server
  api:
    build:
      context: .
      target: production
    container_name: lankalocate-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: ${MONGO_DB_NAME:-lankalocate}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      CLUSTER_ENABLED: ${CLUSTER_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - lankalocate-network
    healthcheck:
      test: ["CMD", "node", "dist/scripts/healthCheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: lankalocate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - lankalocate-network

volumes:
  mongodb_data:
  redis_data:

networks:
  lankalocate-network:
    driver: bridge
